<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="16 color settings shown as a fan of colored lights">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#160f2e"/>
      <stop offset="100%" stop-color="#0b0a1a"/>
    </linearGradient>
    <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg2)"/>
  <g transform="translate(400 430)">
    <g id="dots">
      <circle cx="0" cy="-270" r="34" fill="#ff5d8f"/>
      <circle cx="0" cy="-270" r="34" fill="#ff5d8f" filter="url(#b2)" opacity="0.7"/>
    </g>
    <use href="#dots" transform="rotate(24)"/>
    <use href="#dots" transform="rotate(48)" fill="#ffd166"/>
    <use href="#dots" transform="rotate(72)"/>
    <use href="#dots" transform="rotate(96)"/>
    <use href="#dots" transform="rotate(120)"/>
    <use href="#dots" transform="rotate(144)"/>
    <use href="#dots" transform="rotate(-24)"/>
    <use href="#dots" transform="rotate(-48)"/>
    <use href="#dots" transform="rotate(-72)"/>
  </g>
  <g transform="translate(400 430)">
    <circle cx="0" cy="-270" r="34" fill="#fb8500"/>
    <circle cx="0" cy="-270" r="34" fill="#06d6a0" transform="rotate(48)"/>
    <circle cx="0" cy="-270" r="34" fill="#4cc9f0" transform="rotate(96)"/>
    <circle cx="0" cy="-270" r="34" fill="#9b5de5" transform="rotate(144)"/>
    <circle cx="0" cy="-270" r="34" fill="#f15bb5" transform="rotate(-48)"/>
    <circle cx="0" cy="-270" r="34" fill="#ffd166" transform="rotate(-96)"/>
    <circle cx="0" cy="-270" r="34" fill="#e5446d" transform="rotate(-144)"/>
  </g>
  <text x="400" y="455" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="120" font-weight="800" fill="#fff">16</text>
  <text x="400" y="540" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="46" font-weight="700" fill="#cdb4f6" letter-spacing="4">COLORS</text>
</svg>
