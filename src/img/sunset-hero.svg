<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Sunset lamp projecting a warm sunset glow on a wall">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="28%" stop-color="#ffd166"/>
      <stop offset="52%" stop-color="#fb8500"/>
      <stop offset="74%" stop-color="#e5446d"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </radialGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1530"/>
      <stop offset="100%" stop-color="#0c0a1c"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3550"/>
      <stop offset="100%" stop-color="#16131f"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffe08a" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#room)"/>
  <circle cx="400" cy="330" r="250" fill="url(#glow)" filter="url(#soft)" opacity="0.95"/>
  <circle cx="400" cy="330" r="250" fill="url(#glow)" opacity="0.55"/>
  <polygon points="400,690 320,360 480,360" fill="url(#cone)" opacity="0.7"/>
  <ellipse cx="400" cy="712" rx="150" ry="20" fill="#000" opacity="0.35"/>
  <rect x="356" y="640" width="88" height="74" rx="16" fill="url(#lamp)" stroke="#544c70" stroke-width="2"/>
  <circle cx="400" cy="662" r="13" fill="#ffd166"/>
  <circle cx="400" cy="662" r="13" fill="#ffd166" filter="url(#soft)"/>
  <rect x="384" y="694" width="32" height="8" rx="4" fill="#2a2640"/>
</svg>
